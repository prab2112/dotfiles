# ---- general ----
set -g mouse on
set -g escape-time 10
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---- reload config ----
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---- pane splits (keep current path) ----
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ---- vi-style pane navigation ----
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- status bar ----
set -g status-style bg=#1d2230,fg=#c8d0e0
set -g status-left "#[bold] #S "
set -g status-right "#[fg=#8fd8a3]%H:%M #[fg=#c8d0e0]%d-%b-%Y"
set -g status-left-length 20
setw -g window-status-current-style bg=#2e3a4d,fg=#8fd8a3,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
